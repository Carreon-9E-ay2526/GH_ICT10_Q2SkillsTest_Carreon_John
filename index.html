<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Periodic Table Information Finder of Non-Metals</title>

    <!-- PyScript -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.7.3/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background: #dff3ff;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .main-container {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
        }

        .card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .header {
            background: #0d6efd;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 14px;
        }

        .content {
            padding: 30px;
            background: white;
        }

        .instruction {
            background: #eef7ff;
            border-left: 5px solid #0d6efd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .instruction strong {
            color: #0d6efd;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        #non-metal {
            border: 2px solid #0d6efd;
            border-radius: 10px;
            padding: 12px;
        }

        #non-metal:focus {
            border-color: #084298;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.2);
        }

        .check-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
        }

        .result-title {
            margin-top: 25px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 18px;
        }

        #result {
            min-height: 100px;
            padding: 20px;
            background: #f8fbff;
            border: 2px solid #b6d4fe;
            border-radius: 10px;
        }

        .footer {
            text-align: center;
            color: #6c757d;
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="main-container">

    <div class="card">

        <!-- Header -->
        <div class="header">
            <h1>⚛ Periodic Table Information Finder</h1>
            <p>Non-Metal Elements</p>
        </div>

        <!-- Main Content -->
        <div class="content">

            <div class="instruction">
                <strong>Find a Non-Metal Element</strong><br>
                Enter the chemical symbol of a non-metal element
                to view its information.
            </div>

            <form>

                <label for="non-metal">
                    Non-Metal Element Symbol
                </label>

                <input
                    type="text"
                    id="non-metal"
                    class="form-control"
                    placeholder="Example: H, O, N, Br">

                <button
                    type="button"
                    class="btn btn-primary check-btn"
                    py-click="check_details">
                    Check Details
                </button>

                <div class="result-title">
                    Element Information
                </div>

                <div id="result">
                    Enter an element symbol above to see its information.
                </div>

            </form>

        </div>

    </div>

    <div class="footer">
        Periodic Table • Non-Metal Information Finder
    </div>

</div>

<py-script src="main.py"></py-script>

</body>
</html>
